description: GalaxyCore GC0308 CMOS video sensor

compatible: "galaxycore,gc0308"

include: i2c-device.yaml

properties:
  pwdn-gpios:
    type: phandle-array
    description: Active-high sensor power-down signal

  reset-gpios:
    type: phandle-array
    description: Active-low sensor reset signal

  h-mirror:
    type: boolean
    description: Enable horizontal image mirroring

child-binding:
  child-binding:
    include: video-interfaces.yaml
