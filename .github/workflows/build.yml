name: Build and Release

on:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Verify tag commit is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Build using Dockerfile
        run: docker build -t oskey-builder .

      - name: Build all boards
        run: |
          docker run --rm -v ${{ github.workspace }}:/workdir/oskey oskey-builder /bin/bash -c './build.ts'

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: boards/build/*
          tag_name: ${{ github.ref_name }}
          name: OSKey ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
